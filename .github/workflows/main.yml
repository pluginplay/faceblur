name: ZXP Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build_native_macos:
    name: Build native (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native deps (macOS)
        run: |
          brew install onnxruntime opencv

      - name: Build face_pipeline (macOS)
        run: |
          cmake -S cpp -B cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFACE_PIPELINE_ENABLE_GMC=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH=/opt/homebrew
          cmake --build cpp/build -j 4

      - name: Stage native outputs (macOS)
        run: |
          rm -rf native_out/macos
          mkdir -p native_out/macos
          cmake --install cpp/build --prefix native_out/macos
          chmod +x scripts/stage-native-macos.sh
          scripts/stage-native-macos.sh native_out/macos/face_pipeline native_out/macos

      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: native_out/macos/**

  build_native_windows:
    name: Build native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native deps (Windows)
        run: |
          if not exist C:\vcpkg git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe install onnxruntime:x64-windows opencv4:x64-windows
        shell: cmd

      - name: Build face_pipeline (Windows)
        run: |
          cmake -S cpp -B cpp/build ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DFACE_PIPELINE_ENABLE_GMC=OFF ^
            -DCMAKE_TOOLCHAIN_FILE=C:\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build cpp/build --config Release
        shell: cmd

      - name: Stage native outputs (Windows)
        run: |
          rmdir /S /Q native_out 2>NUL || exit /B 0
          mkdir native_out\\windows
          cmake --install cpp/build --prefix native_out\\windows --config Release
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native_out/windows/**

  package_zxp:
    name: Package ZXP (macOS)
    runs-on: macos-latest
    needs: [build_native_macos, build_native_windows]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: _native

      - name: Place native binaries into src/bin
        run: |
          mkdir -p src/bin
          cp -Rf _native/native-macos/. src/bin/
          # windows binary
          cp -Rf _native/native-windows/. src/bin/

          chmod +x src/bin/face_pipeline || true

      - name: Build ZXP
        run: yarn zxp

      - name: Verify packaged native artifacts
        run: |
          test -f dist/cep/bin/face_pipeline
          test -f dist/cep/bin/face_pipeline.exe
          test -f dist/cep/bin/models/scrfd_2.5g_kps_640x640.onnx
          test -f dist/cep/bin/models/rf_detr_small/rf-detr-small.onnx
          ls dist/cep/bin/lib/*.dylib >/dev/null

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "./dist/zxp/*"
